<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Document</title>
</head>

<body>
  <div class="container">

    <!----Div Header-->
    <div class="header">
      <div class="logo">
        <img src="/img/logo.svg" alt="" />
      </div>
      <div class="social">
        <a href=""><img src="/img/google.svg" alt="" /></a>
        <a href=""><img src="/img/facebook.svg" alt="" /></a>
        <a href=""><img src="/img/twitter.svg" alt=""></a>
        <a href=""><img src="/img/instagram.svg" alt="" /></a>
      </div>
    </div>

    <!----div main-->
    <div class="main">
      <div class="left">
        <img src="/img/image.svg" alt="" />
      </div>


      <div class="right">
        <div class="group-text">
          <h2>HAYAO MIYAZAKI</h2>
          <h1>A VIAGEM DE CHIHIRO</h1>
          <p>
            Chihiro chega a um mundo mágico dominado por uma bruxa. Aqueles
            que a desobedecem são transformados em animais.
          </p>
        </div>

        <!--div btn-->
        <div class="group-btn">
          <button class="now">
            <div class="btn">
              <img src="/img/Play.svg">
              <a href="#"><span> Assistir agora</span></a>
            </div>
          </button>
          <button class="trailer">
            <a href="#"><span>assista o trailer </span></a>
          </button>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
